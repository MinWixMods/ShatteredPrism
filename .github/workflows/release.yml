name: Build Application and Make Release

on:
 workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "ShatteredPrism-source"
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/ShatteredPrism-source ShatteredPrism-${{ env.VERSION }}
          mv ShatteredPrism-Linux-Qt6-Portable*/ShatteredPrism-portable.tar.gz ShatteredPrism-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ShatteredPrism-Linux-aarch64-Qt6-Portable*/ShatteredPrism-portable.tar.gz ShatteredPrism-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ShatteredPrism-*.AppImage/ShatteredPrism-*-x86_64.AppImage ShatteredPrism-Linux-x86_64.AppImage
          mv ShatteredPrism-*.AppImage.zsync/ShatteredPrism-*-x86_64.AppImage.zsync ShatteredPrism-Linux-x86_64.AppImage.zsync
          mv ShatteredPrism-*.AppImage/ShatteredPrism-*-aarch64.AppImage ShatteredPrism-Linux-aarch64.AppImage
          mv ShatteredPrism-*.AppImage.zsync/ShatteredPrism-*-aarch64.AppImage.zsync ShatteredPrism-Linux-aarch64.AppImage.zsync
          mv ShatteredPrism-macOS*/ShatteredPrism.zip ShatteredPrism-macOS-${{ env.VERSION }}.zip

          tar --exclude='.git' -czf ShatteredPrism-${{ env.VERSION }}.tar.gz ShatteredPrism-${{ env.VERSION }}

          for d in ShatteredPrism-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ShatteredPrism-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ShatteredPrism-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ShatteredPrism-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ShatteredPrism-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ShatteredPrism-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ShatteredPrism-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ShatteredPrism-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ShatteredPrism-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Shattered Prism ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ShatteredPrism-Linux-x86_64.AppImage
            ShatteredPrism-Linux-x86_64.AppImage.zsync
            ShatteredPrism-Linux-aarch64.AppImage
            ShatteredPrism-Linux-aarch64.AppImage.zsync
            ShatteredPrism-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ShatteredPrism-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ShatteredPrism-Windows-MinGW-w64-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            ShatteredPrism-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            ShatteredPrism-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            ShatteredPrism-Windows-MSVC-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            ShatteredPrism-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            ShatteredPrism-macOS-${{ env.VERSION }}.zip
            ShatteredPrism-${{ env.VERSION }}.tar.gz
